# Environnement Docker du TP3 : un serveur web PHP + une base PostgreSQL.
# Le même que celui du TP2 : il réutilise l'image décrite dans TP2/docker/.
#
#   docker compose up -d     démarre tout
#   docker compose down      arrête tout (les données de la base sont conservées)
#   docker compose down -v   arrête tout ET efface la base (elle sera recréée)
#
# Une fois démarré :
#   http://localhost:8080   les pages PHP du dossier TP3
#   http://localhost:8081   Adminer, pour explorer la base dans le navigateur
#
# Le TP2 utilise les mêmes ports : arrêter l'un (docker compose down dans son
# dossier) avant de démarrer l'autre.

services:

  # Serveur web : Apache + PHP + pdo_pgsql
  web:
    build: ../TP2/docker
    ports:
      # 127.0.0.1 : accessible uniquement depuis sa propre machine, pas depuis
      # les autres ordinateurs du réseau (wifi de l'IUT...)
      - "127.0.0.1:8080:80"
    volumes:
      # Le dossier TP3 est partagé avec le conteneur : toute modification d'un
      # fichier est visible immédiatement, il suffit de recharger la page.
      - ./:/var/www/html
    environment:
      # Lus par credentials.php pour se connecter à la base
      DB_HOST: db
      DB_NAME: etudiants
      DB_USER: etudiant
      DB_PASSWORD: etudiant
    depends_on:
      db:
        condition: service_healthy

  # Base de données PostgreSQL
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: etudiants
      POSTGRES_USER: etudiant
      POSTGRES_PASSWORD: etudiant
    volumes:
      # Au tout premier démarrage, PostgreSQL exécute les scripts de ce dossier :
      # la base des prix Nobel est donc créée et remplie automatiquement.
      - ./database_nobel.sql:/docker-entrypoint-initdb.d/database_nobel.sql:ro
      # Copie du script accessible depuis psql (\i /sql/database_nobel.sql)
      - ./database_nobel.sql:/sql/database_nobel.sql:ro
      # Les données de la base, conservées entre deux redémarrages
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etudiant -d etudiants"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Adminer : une interface web pour consulter la base
  adminer:
    image: adminer:4.8.1
    ports:
      # Idem : Adminer donne accès à toute la base, il ne doit pas être
      # joignable depuis le réseau
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pgdata:
